inputs: 
  job: 
    required: true 
  pr: 
    required: false 
    
  runs: 
    using: "composite" 
    steps: 
      - uses: actions/checkout@v4 
        with: 
          ref: ${{ github.event.client_payload.sha }} 

      - run: | 
          CONFIG=.audit-swarm/checks-config.yml 
         
          AGENT=$(yq ".checks.${{ inputs.job }}.agent" $CONFIG) 
          PROMPT=$(yq ".checks.${{ inputs.job }}.prompt" $CONFIG) 
          echo my-cli run \
            --agent "$AGENT" \
            --prompt "$PROMPT" \
            --output result.json
        shell: bash 
        
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ inputs.job }}
      #     path: result.json

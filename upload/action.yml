name: Audit Swarm Upload
description: Collect check artifacts and upload bundled results to Audit Swarm.

inputs:
  matrix_result:
    description: Pass needs.audit.result from the workflow upload job
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        path: results
        pattern: audit-swarm-*
        merge-multiple: true

    - name: Bundle results
      shell: bash
      env:
        RUN_ID: ${{ github.event.client_payload.run_id }}
        HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        PR: ${{ github.event.client_payload.pr }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW_RUN_ID: ${{ github.run_id }}
        MATRIX_RESULT: ${{ inputs.matrix_result }}
      run: ${{ github.action_path }}/../src/bundle.sh results bundle.json

    - name: Upload to Audit Swarm
      shell: bash
      env:
        CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
        UPLOAD_TOKEN: ${{ github.event.client_payload.upload_token }}
      run: ${{ github.action_path }}/../src/upload.sh bundle.json
